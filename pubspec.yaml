name: oxide_player
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+27

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.1

  # Audio Core
  equalizer_flutter: ^0.0.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.12
  on_audio_query: ^2.6.0

  # Data
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2 # For state persistence

  # System
  permission_handler: ^12.0.1
  audio_session: ^0.2.2
  device_info_plus: ^12.3.0

  # Utils
  get_it: ^9.2.0
  injectable: ^2.3.2
  logger: ^2.6.2
  rxdart: ^0.28.0
  http: ^1.2.1

  provider: ^6.1.2
  file_picker: ^8.0.0+1
  collection: ^1.18.0
  path: ^1.9.0
  flutter_cache_manager: ^3.3.1

  # YouTube Integration
  dio: ^5.4.0
  youtube_explode_dart: ^3.0.5
  flutter_inappwebview: ^6.0.0
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.3.0
  crypto: ^3.0.3  # Added for SAPISID hash generation
  flutter_localizations:
    sdk: flutter
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/