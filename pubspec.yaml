name: oxide_player
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_bloc: ^8.1.3
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.1

  # Audio Core
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.12
  on_audio_query: ^2.9.0

  # Data
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # System
  permission_handler: ^11.1.0
  audio_session: ^0.1.18
  device_info_plus: ^9.1.2

  # Utils
  get_it: ^7.6.0
  injectable: ^2.3.2
  logger: ^2.0.0
  rxdart: ^0.28.0
  http: ^1.2.1
  on_audio_query_android: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
